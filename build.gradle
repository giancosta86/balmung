buildscript {
    repositories {
        //TODO! Del this!
        mavenLocal()

        mavenCentral()
    }

    dependencies {
        classpath 'info.gianlucacosta.aurora:aurora:10.0.0-SNAPSHOT'
    }
}


apply plugin: 'java'
apply plugin: 'maven'

apply plugin: 'info.gianlucacosta.aurora'


group 'info.gianlucacosta.asgard'
archivesBaseName = 'balmung'
version '2.0.0-SNAPSHOT'

description = 'Java library for German morphology'


sourceCompatibility = 1.8

dependencies {
    compile 'org.hibernate.javax.persistence:hibernate-jpa-2.1-api:1.0.0.Final'

    testCompile 'junit:junit:4.12'
}

aurora {
    gitHubUser = 'giancosta86'

    author {
        name = 'Gianluca Costa'
        email = 'gianluca@gianlucacosta.info'
        url = 'http://gianlucacosta.info/'
    }
}